name: Publish container images

# Builds the three application images and pushes them to Docker Hub.
#
# Requires two repository secrets, set once under
# Settings -> Secrets and variables -> Actions:
#
#   DOCKERHUB_USERNAME  your Docker Hub account name
#   DOCKERHUB_TOKEN     an access token from Docker Hub -> Account settings
#                       -> Personal access tokens, with Read & Write scope.
#                       Not your password: a token can be revoked on its own.
#
# Without them the job is skipped rather than failing, so a fork can run the
# rest of the repository's workflows untouched.

on:
  push:
    branches: [main]
    tags: ["v*"]
    # Documentation-only commits do not change an image.
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".github/**"
      - "!.github/workflows/docker-publish.yml"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    # A pull request from a fork has no access to secrets, so building an
    # image there could only ever fail at the push step.
    if: github.event_name != 'pull_request'

    strategy:
      # One broken service should not hide whether the others build.
      fail-fast: false
      matrix:
        include:
          - service: backend
            context: ./backend
          - service: frontend
            context: ./frontend
          # Published alongside the other two on purpose: without it a
          # self-hoster pulling images would still have to build one service
          # from source, which defeats the point.
          - service: ingest-worker
            context: ./ingest-worker

    steps:
      - uses: actions/checkout@v4

      - name: Check credentials
        id: creds
        run: |
          if [ -n "${{ secrets.DOCKERHUB_USERNAME }}" ] && [ -n "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Docker Hub credentials are not configured; skipping publish."
          fi

      # arm64 is emulated, which is slow but means the images run unmodified
      # on a Raspberry Pi or an Apple-silicon host, both common for a
      # self-hosted archive.
      - name: Set up QEMU
        if: steps.creds.outputs.present == 'true'
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        if: steps.creds.outputs.present == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: steps.creds.outputs.present == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Derive tags
        if: steps.creds.outputs.present == 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/belegeai-${{ matrix.service }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - name: Build and push
        if: steps.creds.outputs.present == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Layer cache lives in GitHub's own store, scoped per service so
          # the three builds do not evict each other.
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

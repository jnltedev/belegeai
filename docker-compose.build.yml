# Builds the three application images from this checkout instead of pulling
# them from Docker Hub. Layered on top of the main file:
#
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
#
# Needed for development, and for anyone running a fork or a change that is
# not published as an image.
services:
  backend:
    build:
      context: ./backend

  ingest-worker:
    build:
      context: ./ingest-worker

  frontend:
    build:
      context: ./frontend
